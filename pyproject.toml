[project]
name = "gonjishk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yousef", email = "Connect@Goyousef.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django==5.2.*",
    "django-environ>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.4",
]


[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    "**/migrations/*.py",
]
[tool.ruff.lint]
select = [
    "E",   
    "F",   
    "I",
    "UP", 
    "DJ",  
    "B", 
]
ignore = ["DJ001"]
[tool.ruff.lint.isort]
known-first-party = ["config"]
